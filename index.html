<style>
  :root{--bg:#0f1216;--card:#171c22;--card2:#1e242c;--line:#2a323c;--txt:#e8edf2;--mut:#8b97a5;--acc:#22c55e;--warn:#f59e0b;--red:#ef4444;--radius:14px}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);-webkit-tap-highlight-color:transparent}
  header{position:sticky;top:0;z-index:20;background:#12161bee;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px}
  header .logo{width:30px;height:30px;border-radius:8px;background:var(--acc);display:grid;place-items:center;color:#04120a;font-weight:800}
  header h1{font-size:16px;margin:0;font-weight:700} header .sub{font-size:11px;color:var(--mut)}
  main{padding:14px;max-width:1000px;margin:0 auto;padding-bottom:92px}
  .tabbar{position:fixed;bottom:0;left:0;right:0;background:#12161b;border-top:1px solid var(--line);display:flex;z-index:20}
  .tabbar button{flex:1;background:none;border:0;color:var(--mut);padding:9px 4px 12px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
  .tabbar button .ic{font-size:19px} .tabbar button.on{color:var(--acc)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
  .card h2{font-size:14px;margin:0 0 10px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .btn{background:var(--acc);color:#04120a;border:0;border-radius:10px;padding:11px 14px;font-weight:700;font-size:14px;cursor:pointer}
  .btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line)}

  input,select,textarea{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:10px;font-size:14px;width:100%;font-family:inherit}
  label{font-size:11px;color:var(--mut);display:block;margin:0 0 4px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pill{display:inline-block;font-size:11px;padding:3px 9px;border-radius:999px;font-weight:700}
  .p-abe{background:#20303f;color:#8ec5ff}.p-prod{background:#3a2f12;color:#ffd479}.p-ok{background:#12351f;color:#79f2a6}.p-atr{background:#3a1717;color:#ff9b9b}.p-enc{background:#26212f;color:#c9b6ff}
  .muted{color:var(--mut);font-size:12px}
  .between{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .tot{font-size:22px;font-weight:800}
  .step{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px;background:var(--card2)}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .kpi{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
  .kpi b{font-size:20px;display:block}.kpi span{font-size:10px;color:var(--mut)}
  .modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:40}.modal.on{display:flex}
  .sheet{background:var(--bg);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:1000px;max-height:94vh;overflow:auto;padding:16px}
  @media(min-width:700px){.modal{align-items:center}.sheet{border-radius:18px}}
  .hint{font-size:11px;color:var(--mut);background:#141a20;border:1px dashed var(--line);border-radius:10px;padding:8px 10px;margin-bottom:12px}
  .gwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;margin-top:6px}
  table.g{border-collapse:collapse;width:100%;min-width:430px;font-size:13px}
  table.g th,table.g td{border-bottom:1px solid var(--line);padding:6px;text-align:center}
  table.g th{color:var(--mut);font-size:11px;position:sticky;top:0;background:var(--card)}
  table.g td:first-child,table.g th:first-child{text-align:left;position:sticky;left:0;background:var(--card);white-space:nowrap;font-weight:600}
  table.g input{width:54px;text-align:center;padding:7px 2px}
  table.g tfoot td{font-weight:700;color:var(--acc)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--mut);font-weight:600;font-size:11px}.right{text-align:right}
  .tl{border-left:2px solid var(--line);margin-left:6px;padding-left:12px}
  .tl div{margin-bottom:8px;font-size:12px;position:relative}.tl div::before{content:'';position:absolute;left:-17px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--acc)}
  .close{float:right;background:none;border:0;color:var(--mut);font-size:22px;cursor:pointer}
  #toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#0d3a1e;color:#c8f7d8;border:1px solid #1c6b39;padding:9px 16px;border-radius:999px;font-size:13px;z-index:60;opacity:0;transition:.25s;pointer-events:none}
  #toast.on{opacity:1}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;margin:3px 4px 3px 0;cursor:pointer;user-select:none}
  .chip.on{border-color:var(--acc);color:var(--acc)}
.uiov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:99999;padding:18px}.uibox{background:var(--card2,#161b22);border:1px solid var(--line,#2a2f37);border-radius:14px;max-width:430px;width:100%;padding:18px;box-shadow:0 14px 44px rgba(0,0,0,.55)}.uititle{font-weight:bold;font-size:15px;margin-bottom:8px;color:var(--acc,#4caf50)}.uimsg{font-size:14px;line-height:1.5;margin-bottom:14px}.uiinp{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line,#2a2f37);background:#0f1319;color:inherit;margin-bottom:14px;font-size:14px}.uibtns{display:flex;gap:8px;justify-content:flex-end}.uibtns .btn{min-width:92px}</style>

<body>
<header><div class="logo">P</div><div><h1>Controle de Produção</h1><div class="sub">Pug Wear · protótipo (Fase 1)</div></div></header>
<main id="app"></main>
<div class="tabbar">
  <button data-t="painel" class="on"><span class="ic">▦</span>Painel</button>
  <button data-t="lotes"><span class="ic">▣</span>Lotes</button>

<script>
const ETAPAS_PADRAO=["Corte","Estamparia","Costura","Bordado","Revisão/Embalagem","Aplicar termocolante","Pregar bolso","Caseado","Catracar cós","Acabamento"];
const ETAPAS_OPC=["Corte","Estamparia","Costura","Bordado","Revisão/Embalagem","Aplicar termocolante","Pregar bolso","Caseado","Catracar cós","Acabamento"];
const TAMS=["P","M","G","GG","G1","G2"];
const CORNOME={VerdeMilitar:"Verde Militar",VERDEMACA:"Verde Maçã",Salmao:"Salmão",ROXO:"Roxo",Preto:"Preto",Grafite:"Grafite",CinzaClaro:"Cinza Claro",CHOCOLATE:"Chocolate",CAPUCCINO:"Capuccino",Branco:"Branco",Bordo:"Bordô",AzulClaro:"Azul Claro",AZULMARINHO:"Azul Marinho",AZULJEANS:"Azul Jeans"};
const CATALOGO={"C-BP-001":{nome:"Camiseta Básica Pug Wear",tams:TAMS,cores:["Branco","Preto","Grafite","CinzaClaro","AZULMARINHO","AzulClaro","AZULJEANS","VerdeMilitar","VERDEMACA","Bordo","CHOCOLATE","CAPUCCINO","Salmao","ROXO"]}};
const money=v=>"R$ "+(Number(v)||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const uid=()=>Math.random().toString(36).slice(2,9);
const hoje=()=>new Date().toISOString().slice(0,10);
const dataBR=iso=>{if(!iso)return"—";const p=(iso+"").slice(0,10).split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:iso;};
const fimMesAnterior=()=>{const d=new Date();const x=new Date(d.getFullYear(),d.getMonth(),0);return x.toISOString().slice(0,10);};
const fimMesAtual=()=>{const d=new Date();const x=new Date(d.getFullYear(),d.getMonth()+1,0);return x.toISOString().slice(0,10);};
const inicioMesAtual=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),1).toISOString().slice(0,10);};
const corLabel=c=>CORNOME[c]||c;
const fdate=d=>d?d.split("-").reverse().join("/"):"—";

let S=load();
function empresaPadrao(){return {nome:"Pug Wear",cnpj:"61.886.777/0001-90",endereco:"Rod. Dep. Antônio Heil, SC-486, 3689 - Sala 02 · Santa Terezinha · Brusque/SC · CEP 88352-288"};}
function load(){try{const x=JSON.parse(localStorage.getItem("pugprod2"));if(x&&x.lotes){if(!x.empresa)x.empresa=empresaPadrao();return x;}}catch(e){}return seed();}
function save(){try{localStorage.setItem("pugprod2",JSON.stringify(S));}catch(e){uiAlert("Armazenamento cheio (provável excesso de fotos). Exporte um backup e remova fotos antigas.");}cloudPush();}

/* ---------- Sincronização na nuvem (Supabase) ---------- */
const SB_URL="https://omyhsvyqajwudzarpjig.supabase.co";
const SB_KEY="sb_publishable_xj_6LaksupDHWetrHhtYtw_y1UlSy74";
const SB_ROW="pugwear";
let sb=null; try{ sb=window.supabase.createClient(SB_URL,SB_KEY); }catch(e){}
let _pushT=null;

/* ---------- Ponte com o Bling (backend Vercel) ---------- */
const BLING_BASE="https://pugwear-producao.vercel.app/api/bling";
const APP_SECRET="pw_9f3k7Qz2Lm8Xr4Tn6Bv1Hs";
async function blingApi(action,params={},opts={}){
  const qs=new URLSearchParams({action,...params}).toString();
  const r=await fetch(BLING_BASE+"?"+qs,{...opts,headers:{"x-app-secret":APP_SECRET,...(opts.headers||{})}});
  let data={}; try{data=await r.json();}catch(e){}
  return {status:r.status,data};
}
async function emitirRemessa(lid){
  const l=S.lotes.find(x=>x.id===lid); if(!l)return;
  const cand=[];
  l.etapas.forEach((et,i)=>{
    if(et.partes&&et.partes.length){
      et.partes.forEach((p,pi)=>{const f=S.faccoes.find(x=>x.id===p.faccaoId);if(f)cand.push({et,i,parte:p,pi,f,qtd:totPartes(parteGrade(l,p))});});
    }else{
      const f=S.faccoes.find(x=>x.id===et.faccaoId);if(f)cand.push({et,i,f,qtd:(Number(et.qtdEnv)||0)>0?Number(et.qtdEnv):totLote(l)});
    }
  });
  if(!cand.length){uiAlert("Nenhuma etapa/facção definida ainda.\n\nEscolha a facção na etapa (ou divida entre facções) antes de emitir a remessa.");return;}
  const msg="Emitir NF de remessa para qual facção?\n\n"+cand.map((c,k)=>`${k+1}) ${c.et.nome}${c.parte?' (dividida)':''} — ${c.f.nome} (${c.qtd} pç)${c.f.blingId?'':' ⚠ NÃO vinculada'}`).join("\n")+"\n\nDigite o número da que quer emitir:";
  const n=await uiPrompt(msg); if(!n)return; const k=Number(n)-1; if(!cand[k]){uiAlert("Opção inválida.");return;}
  const c=cand[k]; const e=c.et; const f=c.f; const alvo=c.parte||c.et; const qtd=c.qtd;
  if(!f.blingId){uiAlert(`A facção "${f.nome}" não está vinculada ao Bling.\n\nEdite a facção e use "Listar facções do Bling" pra vincular (traz o CNPJ) antes de emitir.`);return;}
  // na dúvida (facção sem IE), pergunta antes se é contribuinte
  try{
    const info=await blingApi("faccao",{id:f.blingId});
    const ie=info.data&&info.data.ie;
    if(!ie){
      const ehContrib=await uiConfirm(`A facção "${f.nome}" está SEM Inscrição Estadual (IE) no Bling.\n\nEla É contribuinte de ICMS (tem IE)?\n\nOK = SIM, é contribuinte\nCancelar = NÃO é contribuinte`);
      if(ehContrib){uiAlert(`Então cadastre a IE dela antes de emitir:\nedite a facção "${f.nome}" (no Bling ou no cadastro) e coloque a Inscrição Estadual.\n\nSem a IE não dá pra emitir como contribuinte (a SEFAZ rejeita).`);return;}
      // se não é contribuinte, segue — o backend emite como consumidor final
    }
  }catch(err){}
  // já tem NF-e emitida pra essa remessa? oferece reimprimir
  if(alvo.nfe&&alvo.nfe.link){
    if(await uiConfirm(`Essa remessa (${e.nome}${c.parte?' / '+f.nome:''}) já tem a NF-e nº ${alvo.nfe.numero} emitida.\n\nOK = imprimir a DANFE de novo\nCancelar = emitir uma NOVA nota`)){ window.open(alvo.nfe.link,"_blank"); return; }
  }
  const vin=await uiPrompt("Valor por peça na NF (R$):","16,50"); if(vin===null)return;
  const valor=Number(String(vin).replace(/\./g,'').replace(',','.'))||16.50;
  if(!await uiConfirm(`Emitir e AUTORIZAR a NF de remessa na SEFAZ?\n\nFacção: ${f.nome}\nEtapa: ${e.nome}\nQtd: ${qtd} peças × ${money(valor)} = ${money(qtd*valor)}\nNatureza: Remessa para Industrialização\n\n(A nota é enviada pra SEFAZ de verdade e a DANFE abre pra imprimir.)`))return;
  toast("Emitindo e autorizando na SEFAZ…");
  try{
    const rr=await blingApi("nfe-remessa",{},{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({idContato:f.blingId,quantidade:qtd,valor:valor,obs:"Remessa p/ industrialização - Lote #"+l.numero+" - "+e.nome+(c.parte?(" / "+f.nome):"")})});
    if(!(rr.status>=200&&rr.status<300&&rr.data&&rr.data.data&&rr.data.data.id)){uiAlert("Não consegui criar a NF-e.\n\n"+JSON.stringify(rr.data&&(rr.data.error||rr.data)).slice(0,400));return;}
    const nfeId=rr.data.data.id, numero=rr.data.data.numero||nfeId;
    toast("Enviando pra SEFAZ…");
    const s=await blingApi("nfe-enviar",{},{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:nfeId})});
    const link=(s.data&&(s.data.linkDanfe||s.data.linkPDF))||"";
    if(link){
      alvo.nfe={id:nfeId,numero,link,chave:s.data.chaveAcesso||""};
      l.historico.push({q:new Date().toLocaleString("pt-BR"),t:`NF-e remessa nº ${numero} AUTORIZADA — ${f.nome} / ${e.nome} (${qtd} pç)`});save();
      window.open(link,"_blank");
      uiAlert("✓ NF-e nº "+numero+" AUTORIZADA na SEFAZ!\n\nA DANFE abriu em outra aba pra imprimir. (Pra reimprimir depois, é só clicar em Emitir NF de novo nessa etapa.)");
    } else {
      l.historico.push({q:new Date().toLocaleString("pt-BR"),t:`NF-e remessa nº ${numero} enviada (aguardando SEFAZ) — ${f.nome}`});save();
      uiAlert("NF-e nº "+numero+" criada e enviada, mas a SEFAZ ainda não retornou a autorização (ou houve rejeição).\n\nSituação: "+(s.data&&s.data.situacao)+"\nConfira no Bling em alguns instantes.");
    }
  }catch(err){uiAlert("Erro ao falar com o Bling. Tente de novo.");}
}
function setSB(t){const e=document.getElementById("sbst");if(e)e.textContent=t;}
function cloudPush(){
  if(!sb)return; clearTimeout(_pushT); setSB("sincronizando…");
  _pushT=setTimeout(async()=>{
    try{const {error}=await sb.from("app_estado").upsert({id:SB_ROW,dados:S,atualizado_em:new Date().toISOString()});
      setSB(error?"⚠ salvo só neste aparelho":"☁ salvo na nuvem");}catch(e){setSB("⚠ salvo só neste aparelho");}
  },700);
}
async function cloudPull(){
  if(!sb){setSB("offline");return;}
  if(document.querySelector("#modal.on"))return; // não interromper uma edição aberta
  setSB("carregando…");
  try{const {data,error}=await sb.from("app_estado").select("dados").eq("id",SB_ROW).maybeSingle();
    if(error){setSB("⚠ salvo só neste aparelho");return;}
    const d=data&&data.dados;
    if(d&&d.lotes){S=d;if(!S.empresa)S.empresa=empresaPadrao();const m1=autoLimpaExemplos();const m2=mergeFaccoesDuplicadas();try{localStorage.setItem("pugprod2",JSON.stringify(S));}catch(e){}render();setSB("☁ salvo na nuvem");if(m1||m2)cloudPush();}
    else{cloudPush();} // nuvem vazia: sobe o que já existe aqui
  }catch(e){setSB("⚠ salvo só neste aparelho");}
}
function bootSync(){
  if(window.__booted)return; window.__booted=true;
  const b=document.createElement("div");b.id="sbst";
  b.style.cssText="position:fixed;bottom:10px;right:10px;font-size:11px;background:#000a;color:#fff;padding:4px 9px;border-radius:12px;z-index:9999;opacity:.9;font-family:inherit";
  document.body.appendChild(b);
  cloudPull();
  window.addEventListener("focus",cloudPull);
}

/* ---------- Login (Supabase Auth) ---------- */
async function startApp(){
  if(!sb){ render(); bootSync(); return; }
  try{
    const { data:{ session } } = await sb.auth.getSession();
    if(session){ mostrarApp(); } else { mostrarLogin(); }
    sb.auth.onAuthStateChange((_e,s)=>{ if(s){ mostrarApp(); } else { mostrarLogin(); } });
  }catch(e){ render(); bootSync(); }
}
function mostrarApp(){
  const ov=document.getElementById("loginOv"); if(ov)ov.remove();
  render(); bootSync(); addLogoutBtn();
}
function mostrarLogin(){
  if(document.getElementById("loginOv"))return;
  const ov=document.createElement("div"); ov.id="loginOv";
  ov.style.cssText="position:fixed;inset:0;background:var(--bg);z-index:10000;display:grid;place-items:center;padding:20px";
  ov.innerHTML=`<div style="width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><div style="width:32px;height:32px;border-radius:8px;background:var(--acc);display:grid;place-items:center;color:#04120a;font-weight:800">P</div><b style="font-size:16px">Pug Wear — Produção</b></div>
    <div class="muted" style="margin-bottom:14px">Entre com seu e-mail e senha.</div>
    <label>E-mail</label><input id="lgEmail" type="email" autocomplete="username" style="margin-bottom:10px">
    <label>Senha</label><input id="lgPass" type="password" autocomplete="current-password" style="margin-bottom:14px">
    <button class="btn" style="width:100%" onclick="fazerLogin()">Entrar</button>
    <div id="lgErr" style="color:var(--red);font-size:12px;margin-top:10px;min-height:14px"></div>
  </div>`;
  document.body.appendChild(ov);
  const p=document.getElementById("lgPass"); if(p)p.addEventListener("keydown",e=>{ if(e.key==="Enter")fazerLogin(); });
}
async function fazerLogin(){
  const email=(document.getElementById("lgEmail").value||"").trim();
  const password=document.getElementById("lgPass").value||"";
  const err=document.getElementById("lgErr"); err.textContent="Entrando…";
  try{
    const { error } = await sb.auth.signInWithPassword({ email, password });
    err.textContent = error ? "E-mail ou senha inválidos." : "";
  }catch(e){ err.textContent="Erro ao entrar. Tente de novo."; }
}
function addLogoutBtn(){
  const h=document.querySelector("header"); if(!h||document.getElementById("logoutBtn"))return;
  const b=document.createElement("button"); b.id="logoutBtn"; b.className="btn sec mini"; b.textContent="Sair";
  b.style.cssText="margin-left:auto"; b.onclick=async()=>{ try{ await sb.auth.signOut(); }catch(e){} location.reload(); };
  h.appendChild(b);
}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),1600);}
function seed(){
  const f=[{id:uid(),nome:"Costura Maria (exemplo)",servico:"Costura",valor:2.50},{id:uid(),nome:"Bordado Nei (exemplo)",servico:"Bordado",valor:1.20}];
  const lote={id:uid(),numero:1,ref:"C-BP-001",produto:"Camiseta Básica Pug Wear",criadoEm:hoje(),foto:"",obs:"",custoMP:0,encerrado:false,
    gradeCores:{Grafite:{P:10,M:20,G:30,GG:20,G1:12,G2:8},Preto:{P:8,M:16,G:24,GG:16,G1:10,G2:6}},
    etapas:[{nome:"Corte",faccaoId:"",valor:0,qtdEnv:150,qtdRet:150,dtEnv:hoje(),dtRet:hoje(),dtPrev:"",status:"Concluído",pago:false},
      {nome:"Costura",faccaoId:f[0].id,valor:2.50,qtdEnv:150,qtdRet:0,dtEnv:hoje(),dtRet:"",dtPrev:"",status:"Em produção",pago:false},
      {nome:"Bordado",faccaoId:f[1].id,valor:1.20,qtdEnv:0,qtdRet:0,dtEnv:"",dtRet:"",dtPrev:"",status:"Aberto",pago:false},
      {nome:"Acabamento",faccaoId:"",valor:0,qtdEnv:0,qtdRet:0,dtEnv:"",dtRet:"",dtPrev:"",status:"Aberto",pago:false}],
    historico:[{q:new Date().toLocaleString("pt-BR"),t:"Lote criado (exemplo)"}]};
  return {faccoes:f,lotes:[lote],seq:2,empresa:empresaPadrao()};
}
function coresDe(l){return l.gradeCores?l.gradeCores:{[l.cor||"—"]:(l.grade||{})};}
function tamsDe(l){ // tamanhos REAIS do lote (número ou letra), nunca o TAMS fixo
  if(l&&l.tams&&l.tams.length)return l.tams;
  const c=coresDe(l);const set=new Set();Object.keys(c).forEach(cor=>Object.keys(c[cor]||{}).forEach(t=>set.add(t)));
  const arr=[...set];if(!arr.length)return TAMS.slice();
  const letras=TAMS.filter(t=>arr.includes(t));
  const nums=arr.filter(t=>!TAMS.includes(t)).sort((a,b)=>(parseFloat(a)||0)-(parseFloat(b)||0));
  return letras.concat(nums);}
function totGrade(g){return TAMS.reduce((s,t)=>s+(Number(g[t])||0),0);}
function totLote(l){return Object.values(coresDe(l)).reduce((s,g)=>s+totGrade(g),0);}
function etStatus(e){
  if(e.partes&&e.partes.length){
    const todas=e.partes.every(p=>p.status==="Concluído");
    let st=todas?"Concluído":(e.partes.some(p=>p.status==="Concluído"||p.status==="Em produção")?"Em produção":"Aberto");
    if(st!=="Concluído"&&e.dtPrev&&e.dtPrev<hoje())return"Atrasado";return st;
  }
  if(e.status!=="Concluído"&&e.dtPrev&&e.dtPrev<hoje())return"Atrasado";return e.status;}
function statusLote(l){if(l.encerrado)return"Encerrado";const st=l.etapas.map(etStatus);if(st.includes("Atrasado"))return"Atrasado";if(st.every(s=>s==="Concluído"))return"Concluído";if(st.some(s=>s==="Em produção"))return"Em produção";return"Aberto";}
function pill(s){const m={"Aberto":"p-abe","Em produção":"p-prod","Concluído":"p-ok","Atrasado":"p-atr","Encerrado":"p-enc"};return`<span class="pill ${m[s]||'p-abe'}">${s}</span>`;}
function fName(id){const f=S.faccoes.find(x=>x.id===id);return f?f.nome:"—";}

let TAB=localStorage.getItem('pwtab')||"painel";
document.querySelectorAll(".tabbar button").forEach(b=>b.onclick=()=>{TAB=b.dataset.t;try{localStorage.setItem('pwtab',TAB);}catch(e){}document.querySelectorAll(".tabbar button").forEach(x=>x.classList.toggle("on",x===b));render();});

function cardLote(l){const cores=Object.keys(coresDe(l));const et=l.etapas.find(e=>etStatus(e)==="Em produção"||etStatus(e)==="Atrasado")||l.etapas.find(e=>e.status==="Aberto");
  return `<div class="card" style="background:var(--card2);cursor:pointer" onclick="abrirLote('${l.id}')"><div class="between"><b>#${l.numero} · ${l.produto}</b>${pill(statusLote(l))}</div>

let _fLotes={q:"",st:""};

  const L=S.lotes.slice().reverse().filter(l=>{
    if(_fLotes.st&&statusLote(l)!==_fLotes.st)return false;
    if(_fLotes.q){const q=_fLotes.q.toLowerCase();const txt=(l.produto+" "+l.ref+" "+Object.keys(coresDe(l)).map(corLabel).join(" ")+" #"+l.numero).toLowerCase();if(!txt.includes(q))return false;}
    return true;});
  document.getElementById("app").innerHTML=`<div class="between" style="margin-bottom:10px"><h2 style="margin:0">Lotes</h2><button class="btn" onclick="novoLote()">+ Novo lote</button></div>

    ${L.map(cardLote).join("")||'<div class="muted">Nenhum lote com esse filtro.</div>'}`;}

let _fotoPend="",_ref="",_etSel=ETAPAS_PADRAO.slice();
function lerFoto(inp){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{_fotoPend=e.target.result;document.getElementById("fotoPrev").innerHTML=`<div class="card" style="background:var(--card2)"><div class="between"><b>Foto anexada</b><button class="btn mini red" onclick="_fotoPend='';document.getElementById('fotoPrev').innerHTML=''">remover</button></div><img src="${_fotoPend}" style="width:100%;border-radius:10px;margin-top:6px"><div class="hint" style="margin-top:8px">📷 <b>Versão online:</b> a IA lê a foto e preenche a grade sozinha. No protótipo, fica anexada como referência.</div></div>`;};r.readAsDataURL(f);}
function toggleEt(n){if(_etSel.includes(n))_etSel=_etSel.filter(x=>x!==n);else _etSel.push(n);document.getElementById("etChips").innerHTML=chipsEt();}
function chipsEt(){return ETAPAS_OPC.map(n=>`<span class="chip ${_etSel.includes(n)?'on':''}" onclick="toggleEt('${n}')">${_etSel.includes(n)?'✓ ':''}${n}</span>`).join("");}

  const refs=Object.keys(CATALOGO).map(r=>`<option value="${r}">`).join("");
  openSheet(`<button class="close" onclick="closeSheet()">×</button><h2>Novo lote</h2>
    <div class="hint">Digite a <b>referência</b> (ex.: C-BP-001) que as cores aparecem — ou preencha manual. Também dá pra mandar foto.</div>
    <div class="row" style="margin-bottom:10px"><button class="btn sec" style="flex:1" onclick="document.getElementById('fCam').click()">📷 Tirar foto</button><button class="btn sec" style="flex:1" onclick="document.getElementById('fImg').click()">🖼️ Adicionar imagem</button></div>
    <input id="fCam" type="file" accept="image/*" capture="environment" style="display:none" onchange="lerFoto(this)"><input id="fImg" type="file" accept="image/*" style="display:none" onchange="lerFoto(this)"><div id="fotoPrev"></div>
    <div class="grid2"><div><label>Referência</label><input id="ref" list="refs" placeholder="C-BP-001" oninput="onRef(this.value)"><datalist id="refs">${refs}</datalist></div><div><label>Nome do produto</label><input id="pnome" placeholder="(preenche sozinho)"></div></div>
    <button class="btn sec mini" type="button" style="margin-top:8px" onclick="puxarCatalogo()">⬇️ Puxar cores do Bling</button>
    <div id="gradeArea" style="margin-top:12px"></div>
    <label style="margin-top:12px">Etapas do roteiro (marque as que este lote tem)</label><div id="etChips">${chipsEt()}</div>
    <label style="margin-top:10px">Observações</label><textarea id="lobs" rows="2" placeholder="Ex.: usar linha X, prazo apertado…"></textarea>
    <button class="btn" style="width:100%;margin-top:12px" onclick="salvarLote()">Criar lote</button>`);
  onRef("");
}
function onRef(v){_ref=v;const cat=CATALOGO[v.trim()];const area=document.getElementById("gradeArea");
  if(cat){document.getElementById("pnome").value=cat.nome;
    area.innerHTML=`<label>Grade por cor — <b>${v.trim()}</b></label><div class="gwrap"><table class="g"><thead><tr><th>Cor</th>${cat.tams.map(t=>`<th>${t}</th>`).join("")}</tr></thead>
      <tbody>${cat.cores.map(c=>`<tr><td>${corLabel(c)}</td>${cat.tams.map(t=>`<td><input type="number" inputmode="numeric" id="gc_${c}_${t}" placeholder="0" oninput="somaGrade()"></td>`).join("")}</tr>`).join("")}</tbody>
      <tfoot><tr><td>Total</td>${cat.tams.map(t=>`<td id="colt_${t}">0</td>`).join("")}</tr></tfoot></table></div>
      <div class="between" style="margin-top:6px"><span class="muted">Só cores com quantidade viram lote.</span><b id="gtot" style="color:var(--acc)">0 pç</b></div>`;
  }else{area.innerHTML=`<label>Cor</label><input id="corManual" placeholder="Ex.: Grafite"><label style="margin-top:8px">Grade</label><div class="gwrap"><table class="g"><thead><tr><th>Tam</th>${TAMS.map(t=>`<th>${t}</th>`).join("")}</tr></thead><tbody><tr><td>Qtd</td>${TAMS.map(t=>`<td><input type="number" id="gm_${t}" placeholder="0"></td>`).join("")}</tr></tbody></table></div>`;}
}
async function puxarCatalogo(){
  const ref=(document.getElementById("ref").value||"").trim();
  if(!ref){uiAlert("Digite a referência primeiro (ex.: C-BP-001).");return;}
  const area=document.getElementById("gradeArea");
  area.innerHTML=`<div class="muted">Puxando cores do Bling…</div>`;
  try{
    const {status,data}=await blingApi("produto",{ref});
    if(status!==200||!data.cores||!data.cores.length){area.innerHTML=`<div class="muted">Não encontrei cores pra "${ref}" no Bling. Confira a referência ou preencha manual.</div>`;return;}
    CATALOGO[ref]={nome:data.produto||ref,cores:data.cores,tams:data.tamanhos||TAMS};
    if(data.produto)document.getElementById("pnome").value=data.produto;
    onRef(ref);toast(data.cores.length+" cores puxadas do Bling ✓");
  }catch(e){area.innerHTML=`<div class="muted">Erro ao puxar do Bling. Tente de novo.</div>`;}
}
function somaGrade(){const cat=CATALOGO[(_ref||"").trim()];if(!cat)return;let tot=0;cat.tams.forEach(t=>{let ct=0;cat.cores.forEach(c=>{ct+=Number((document.getElementById(`gc_${c}_${t}`)||{}).value)||0;});document.getElementById("colt_"+t).textContent=ct;tot+=ct;});document.getElementById("gtot").textContent=tot+" pç";}
function lerGradeEntrada(prefixCat){const ref=(document.getElementById("ref").value||"").trim();const cat=CATALOGO[ref];const gradeCores={};
  if(cat){cat.cores.forEach(c=>{const g={};let has=false;cat.tams.forEach(t=>{const v=Number((document.getElementById(`gc_${c}_${t}`)||{}).value)||0;g[t]=v;if(v>0)has=true;});if(has)gradeCores[c]=g;});}
  else{const cor=(document.getElementById("corManual").value||"Única").trim();const g={};let has=false;TAMS.forEach(t=>{const v=Number((document.getElementById("gm_"+t)||{}).value)||0;g[t]=v;if(v>0)has=true;});if(has)gradeCores[cor]=g;}
  return {ref,gradeCores};}
function salvarLote(){const {ref,gradeCores}=lerGradeEntrada();
  if(!Object.keys(gradeCores).length){uiAlert("Preencha ao menos uma quantidade.");return;}
  if(!_etSel.length){uiAlert("Selecione ao menos uma etapa.");return;}
  const nome=(document.getElementById("pnome").value)||ref||"Produto";const tot=Object.values(gradeCores).reduce((s,g)=>s+totGrade(g),0);
  const et=ETAPAS_OPC.filter(n=>_etSel.includes(n));
  const l={id:uid(),numero:S.seq++,ref,produto:nome,criadoEm:hoje(),foto:_fotoPend||"",obs:document.getElementById("lobs").value||"",custoMP:0,encerrado:false,gradeCores,
    tams:(CATALOGO[ref]&&CATALOGO[ref].tams&&CATALOGO[ref].tams.length)?CATALOGO[ref].tams.slice():Object.keys((Object.values(gradeCores)[0])||{}),
    etapas:et.map((n,i)=>({nome:n,faccaoId:"",valor:0,qtdEnv:i===0?tot:0,qtdRet:0,dtEnv:i===0?hoje():"",dtRet:"",dtPrev:"",status:i===0?"Em produção":"Aberto",pago:false})),
    historico:[{q:new Date().toLocaleString("pt-BR"),t:"Lote criado ("+et.join(" → ")+")"}]};
  S.lotes.push(l);_fotoPend="";save();closeSheet();TAB="lotes";render();toast("Lote #"+l.numero+" criado");
}

function gradeTabela(l){const c=coresDe(l),cores=Object.keys(c);const T=tamsDe(l);

    ${cores.map(cor=>`<tr><td>${corLabel(cor)}</td>${T.map(t=>`<td>${c[cor][t]||0}</td>`).join("")}<td><b>${totGrade(c[cor])}</b></td></tr>`).join("")}</tbody>
    <tfoot><tr><td>Total</td>${T.map(t=>`<td>${cores.reduce((s,cor)=>s+(Number(c[cor][t])||0),0)}</td>`).join("")}<td><b>${totLote(l)}</b></td></tr></tfoot></table></div>`;}

function abrirLote(id){openSheet(loteSheetHtml(S.lotes.find(x=>x.id===id)));}
function refreshLote(id){const s=document.getElementById("sheet");const y=s.scrollTop;s.innerHTML=loteSheetHtml(S.lotes.find(x=>x.id===id));s.scrollTop=y;}
function custoLote(l){let mo=0;l.etapas.forEach(e=>{
    if(e.partes&&e.partes.length){e.partes.forEach(p=>{mo+=qParte(l,p)*(Number(p.valor)||0);});}
    else{mo+=(Number(e.valor)||0)*qEtapa(e);}});
  const tot=totLote(l);const mp=(Number(l.custoMP)||0)*tot;const total=mo+mp;return{mo,mp,total,porPeca:tot?total/tot:0};}
function custoCard(l){const c=custoLote(l);return `<div class="card" style="background:var(--card2);margin-top:12px"><div class="between"><h2 style="margin:0;font-size:13px">Custo</h2><span>Por peça: <b style="color:var(--acc)">${money(c.porPeca)}</b></span></div>
  <div class="grid2" style="margin-top:6px"><div><label>Matéria-prima / peça</label><input type="number" step="0.01" value="${l.custoMP||0}" onchange="setLoteNum('${l.id}','custoMP',this.value)"></div><div><label>Composição</label><div class="muted">Mão de obra: ${money(c.mo)}<br>Matéria-prima: ${money(c.mp)}<br><b>Total: ${money(c.total)}</b></div></div></div></div>`;}
function stepHtml(l,e,i){const st=etStatus(e);const dividida=e.partes&&e.partes.length;

  }
  const val=(Number(e.valor)||0)*qEtapa(e);
  return `<div class="step"><div class="between"><b>${e.nome}</b><span>${pill(st)} <button class="btn mini sec" title="Subir" onclick="moveEtapa('${l.id}',${i},-1)"${i===0?' disabled':''}>↑</button> <button class="btn mini sec" title="Descer" onclick="moveEtapa('${l.id}',${i},1)"${i===l.etapas.length-1?' disabled':''}>↓</button> <button class="btn mini red" style="margin-left:6px" onclick="rmEtapa('${l.id}',${i})">×</button></span></div>
    <div class="grid2">
      <div><label>Facção</label><select onchange="setEt('${l.id}',${i},'faccaoId',this.value)"><option value="">—</option>${S.faccoes.map(f=>`<option value="${f.id}" ${f.id===e.faccaoId?"selected":""}>${f.nome}</option>`).join("")}<option value="__new">＋ Nova facção…</option></select></div>

      <div><label>Data envio</label><input type="date" value="${e.dtEnv}" onchange="setEt('${l.id}',${i},'dtEnv',this.value)"></div>
      <div><label>Previsão (retorno)</label><input type="date" value="${e.dtPrev||''}" onchange="setEt('${l.id}',${i},'dtPrev',this.value)"></div>

function pagarEtapa(lid,i){const l=S.lotes.find(x=>x.id===lid);const e=l.etapas[i];e.pago=true;if(e.partes)e.partes.forEach(p=>p.pago=true);l.historico.push({q:new Date().toLocaleString("pt-BR"),t:`Pagamento baixado — ${e.nome}${e.faccaoId?" ("+fName(e.faccaoId)+")":""}`});save();refreshLote(lid);toast("Baixado ✓");}

function totPartes(grade){return Object.values(grade||{}).reduce((s,g)=>s+totGrade(g),0);}
function parteGrade(l,p){const c0=coresDe(l);const cs=(p.cores&&p.cores.length)?p.cores:Object.keys(p.grade||{});const g={};cs.forEach(c=>{if(c0[c])g[c]=c0[c];});return g;}
// quantidade que vale pra PAGAR: usa a retornada quando já preenchida (>0), senão a enviada
function retReal(env,qtdRet){const r=Number(qtdRet)||0;if(r>0)return r;if(r<0)return Math.max(0,env+r);return env;} // r>0 = qtd que voltou; r<0 = "X a menos" (env - X); 0 = ainda não voltou
function qEtapa(e){return retReal(Number(e.qtdEnv)||0,e.qtdRet);}
function qParte(l,p){const env=totPartes(parteGrade(l,p));return retReal(env,p.qtdRet);}
function divisaoHtml(l,e,i){

    h+=e.partes.map((p,pi)=>{const g=parteGrade(l,p);const q=totPartes(g);const cst=qParte(l,p)*(Number(p.valor)||0);
      const concl=p.status==="Concluído";const ret=Number(p.qtdRet)||0;
      return `<div class="card" style="background:var(--card2);margin:4px 0"><div class="between"><b>${fName(p.faccaoId)} ${concl?'<span class="pill p-ok">concluída</span>':'<span class="pill p-prod">em produção</span>'}</b><span>${q} pç · ${money(cst)}</span></div>
      <div class="muted" style="font-size:11px">${Object.keys(g).map(c=>corLabel(c)+" ("+totGrade(g[c])+")").join(", ")}</div>
      <div class="row" style="margin-top:6px;align-items:center;gap:8px"><span class="muted" style="font-size:12px">Enviado ${q}</span><label class="muted" style="font-size:12px">Retornou:</label><input type="number" id="pret_${i}_${pi}" style="width:90px;padding:4px 6px" value="${ret||''}" placeholder="qtd" onchange="setPartRet('${l.id}',${i},${pi},this.value)">${(()=>{const r2=qParte(l,p);return (Number(p.qtdRet)!==0&&r2<q)?`<span style="color:var(--warn);font-size:12px">voltou ${r2} · perda ${q-r2}</span>`:(Number(p.qtdRet)!==0?`<span style="color:var(--acc);font-size:12px">voltou ${r2}</span>`:'');})()}</div>
      <div class="row" style="margin-top:6px;align-items:center;gap:8px"><label class="muted" style="font-size:12px">📅 Data retorno (fecha facção):</label><input type="date" style="padding:4px 6px" value="${p.dtRet||''}" onchange="setPartDtRet('${l.id}',${i},${pi},this.value)"></div>
      ${p.nfe?`<div style="margin-top:4px"><button class="btn mini sec" onclick="imprimirDanfeParte('${l.id}',${i},${pi})">🖨️ DANFE nº ${p.nfe.numero}</button></div>`:''}
      <div class="between" style="margin-top:6px"><button class="btn mini sec" onclick="printRomaneioParte('${l.id}',${i},${pi})">🖨️ Romaneio</button><span>${concl?`<button class="btn mini sec" onclick="setPartStatus('${l.id}',${i},${pi},'Em produção')">↩️ reabrir</button>`:`<button class="btn mini sec" onclick="concluirParte('${l.id}',${i},${pi})">✅ Concluir</button>`} ${p.pago?`<span class="pill p-ok">pago</span> <button class="btn mini sec" onclick="estornarParte('${l.id}',${i},${pi})">↩️ estornar</button>`:`<button class="btn mini" onclick="pagarParte('${l.id}',${i},${pi})">💰 dar baixa (pago)</button>`}</span></div></div>`;}).join("");
    h+=`<div class="row" style="margin-top:4px"><button class="btn sec mini" onclick="dividirEtapa('${l.id}',${i})">✏️ Editar divisão</button><button class="btn mini red" onclick="removerDivisao('${l.id}',${i})">Remover divisão</button></div>`;
  }else{
    h+=`<button class="btn sec mini" onclick="dividirEtapa('${l.id}',${i})">✂️ Dividir entre facções</button>`;
  }
  return h+`</div>`;
}
function dividirEtapa(lid,i,pre){const l=S.lotes.find(x=>x.id===lid);const e=l.etapas[i];const c0=coresDe(l);const cores=Object.keys(c0);
  const atual={};(e.partes||[]).forEach(p=>((p.cores&&p.cores.length)?p.cores:Object.keys(p.grade||{})).forEach(c=>atual[c]=p.faccaoId));
  if(pre)Object.keys(pre).forEach(c=>{if(pre[c])atual[c]=pre[c];});
  const fl=S.faccoes.slice().sort((a,b)=>(a.nome||'').localeCompare(b.nome||''));
  const opt=sel=>`<option value="">—</option>`+fl.map(x=>`<option value="${x.id}" ${x.id===sel?"selected":""}>${x.nome}</option>`).join("");
  openSheet(`<button class="close" onclick="abrirLote('${lid}')">×</button><h2>Dividir "${e.nome}"</h2>
    <div class="hint">Escolha qual facção faz cada cor. Cada facção vira uma parte com romaneio e valor próprios. (Divisão por cor.)</div>
    <div class="row" style="margin:6px 0;gap:8px;align-items:center"><button class="btn sec mini" type="button" onclick="puxarFaccoesDivisao('${lid}',${i})">📋 Puxar facções do Bling</button><span class="muted" style="font-size:11px">${S.faccoes.length} facção(ões) na lista · digite pra filtrar no seletor</span></div>
    ${cores.map((c,ci)=>`<div class="between" style="margin:8px 0"><b>${corLabel(c)} <span class="muted">(${totGrade(c0[c])} pç)</span></b><select id="dv_${ci}" style="width:auto;padding:6px 8px">${opt(atual[c]||"")}</select></div>`).join("")}
    <button class="btn" style="width:100%;margin-top:12px" onclick="salvarDivisao('${lid}',${i})">Salvar divisão</button>`);}
async function carregarFaccoesBlingParaLista(){
  const {status,data}=await blingApi("fornecedores",{});
  const lista=(data&&data.fornecedores)||[];
  if(status!==200||!lista.length)return {ok:false,add:0};
  let add=0;
  lista.forEach(c=>{const bid=String(c.id);
    const existe=S.faccoes.some(f=>String(f.blingId)===bid||(f.nome||'').trim().toLowerCase()===(c.nome||'').trim().toLowerCase());
    if(!existe){S.faccoes.push({id:uid(),nome:c.nome,servico:"Costura",valor:0,cnpj:c.doc||"",endereco:"",blingId:bid});add++;}});
  if(add)save();
  return {ok:true,add};
}
function puxarFaccoesDivisao(lid,i){
  const l=S.lotes.find(x=>x.id===lid);const c0=coresDe(l);
  const pre={};Object.keys(c0).forEach((c,ci)=>{const el=document.getElementById("dv_"+ci);if(el&&el.value)pre[c]=el.value;});
  toast("Puxando facções do Bling…");
  carregarFaccoesBlingParaLista().then(r=>{
    if(!r.ok){toast("Não consegui puxar do Bling");return;}
    dividirEtapa(lid,i,pre);
    toast(r.add?("+"+r.add+" facções carregadas ✓"):"Facções já estavam na lista");
  }).catch(()=>toast("Erro ao puxar do Bling"));
}
function salvarDivisao(lid,i){const l=S.lotes.find(x=>x.id===lid);const e=l.etapas[i];const c0=coresDe(l);const grupos={};
  Object.keys(c0).forEach((c,ci)=>{const fid=(document.getElementById("dv_"+ci)||{}).value||"";if(!fid)return;
    if(!grupos[fid]){const f=S.faccoes.find(x=>x.id===fid);grupos[fid]={faccaoId:fid,valor:f?f.valor:0,cores:[],status:"Em produção",pago:false};}
    grupos[fid].cores.push(c);});
  const partes=Object.values(grupos);
  if(!partes.length){uiAlert("Escolha ao menos uma facção pra alguma cor.");return;}
  e.partes=partes;if(!e.dtEnv)e.dtEnv=hoje();if(e.status==="Aberto")e.status="Em produção";
  l.historico.push({q:new Date().toLocaleString("pt-BR"),t:`${e.nome} dividida em ${partes.length} facção(ões)`});
  save();abrirLote(lid);toast("Divisão salva ✓");}

async function setEt(lid,i,campo,val){if(campo==="faccaoId"&&val==="__new"){quickFaccao(lid,i);return;}const l=S.lotes.find(x=>x.id===lid);const e=l.etapas[i];const antes=e[campo];
  e[campo]=(["valor","qtdEnv","qtdRet"].includes(campo))?Number(val)||0:val;
  if(campo==="status"&&antes!==val){e.dtRet=val==="Concluído"&&!e.dtRet?hoje():e.dtRet;l.historico.push({q:new Date().toLocaleString("pt-BR"),t:`${e.nome}: ${val}`+(e.faccaoId?` (${fName(e.faccaoId)})`:"")});}
  if(campo==="dtRet"){if(val){if(e.status!=="Concluído")e.status="Concluído";l.historico.push({q:new Date().toLocaleString("pt-BR"),t:`${e.nome}: retorno em ${fdate(val)}`+(e.faccaoId?` (${fName(e.faccaoId)})`:"")});}}
  if(campo==="faccaoId"){const f=S.faccoes.find(x=>x.id===val);if(f&&!e.valor)e.valor=f.valor;}
  if(campo==="qtdRet"&&antes!==e.qtdRet){const q=e.qtdRet;const prox=l.etapas[i+1];
    if(q>0&&prox&&await uiConfirm(`Aplicar ${q} peças como "Qtd enviada" da próxima etapa (${prox.nome})?`)){prox.qtdEnv=q;if(!prox.dtEnv)prox.dtEnv=hoje();if(prox.status==="Aberto")prox.status="Em produção";l.historico.push({q:new Date().toLocaleString("pt-BR"),t:`${prox.nome}: recebeu ${q} pç da ${e.nome}`});}}
  save();refreshLote(lid);toast("Salvo ✓");}

function salvarGrade(id){const l=S.lotes.find(x=>x.id===id);const T=tamsDe(l);const gc={};Object.keys(coresDe(l)).forEach(cor=>{const g={};let has=false;T.forEach(t=>{const v=Number((document.getElementById(`eg_${cor}_${t}`)||{}).value)||0;g[t]=v;if(v>0)has=true;});if(has)gc[cor]=g;});
  l.gradeCores=gc;const tot=totLote(l);const corte=l.etapas.find(e=>e.nome==="Corte");if(corte&&corte.status!=="Concluído")corte.qtdEnv=tot;
  l.historico.push({q:new Date().toLocaleString("pt-BR"),t:"Grade editada (total "+tot+")"});save();abrirLote(id);toast("Grade salva ✓");}

function printRomaneioParte(lid,i,pi){const l=S.lotes.find(x=>x.id===lid);const e=l.etapas[i];const p=e.partes[pi];printRomaneio(lid,{cores:parteGrade(l,p),faccaoId:p.faccaoId,etapaNome:e.nome,valor:p.valor});}
function printRomaneio(id,override){const l=S.lotes.find(x=>x.id===id);
  let c,fac,destNome,valorUnit=0;
  if(override){c=override.cores||{};fac=override.faccaoId?S.faccoes.find(x=>x.id===override.faccaoId):null;destNome=override.etapaNome||null;valorUnit=Number(override.valor)||0;}
  else{c=coresDe(l);const sel=document.getElementById("destEt");const idx=sel?sel.value:"";const destino=(idx!==""&&l.etapas[idx])?l.etapas[idx]:null;fac=destino&&destino.faccaoId?S.faccoes.find(x=>x.id===destino.faccaoId):null;destNome=destino?destino.nome:null;valorUnit=destino?(Number(destino.valor)||0):0;}
  const cores=Object.keys(c);const totalPecas=cores.reduce((s,cor)=>s+totGrade(c[cor]),0);
  const moLote=custoLote(l).mo;const valorTotal=valorUnit>0?valorUnit*totalPecas:moLote;const valorPP=valorUnit>0?valorUnit:(totalPecas?moLote/totalPecas:0);
  const em=S.empresa||{};
  const header=`<div class="hdr"><div class="emit"><div class="nm">${em.nome||"Empresa"}</div>${em.cnpj?`<div>CNPJ: ${em.cnpj}</div>`:""}${em.endereco?`<div class="ad">${em.endereco}</div>`:""}</div>
    <div class="dest"><div class="lb">DESTINATÁRIO / FACÇÃO</div>${fac?`<div class="nm">${fac.nome}</div>${fac.cnpj?`<div>CNPJ: ${fac.cnpj}</div>`:""}${fac.endereco?`<div class="ad">${fac.endereco}</div>`:""}${destNome?`<div class="ad">Etapa: ${destNome}</div>`:""}`:`<div class="ln"></div><div class="ln"></div>`}</div></div>`;
  const rows=cores.map(cor=>`<tr><td>${corLabel(cor)}</td>${TAMS.map(t=>`<td>${c[cor][t]||0}</td>`).join("")}<td><b>${totGrade(c[cor])}</b></td></tr>`).join("");
  const foot=`<tr><td>Total</td>${TAMS.map(t=>`<td>${cores.reduce((s,cor)=>s+(Number(c[cor][t])||0),0)}</td>`).join("")}<td><b>${totalPecas}</b></td></tr>`;
  const w=window.open("","_blank");
  w.document.write(`<html><head><title>Romaneio #${l.numero}</title><style>body{font-family:Arial;padding:22px;color:#111}h1{font-size:17px;margin:12px 0 4px}
    .hdr{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #222;padding-bottom:8px}
    .emit .nm{font-size:17px;font-weight:bold}.dest{text-align:right;min-width:240px}.dest .lb{font-size:10px;color:#666;letter-spacing:.5px}.dest .nm{font-weight:bold}
    .ad{font-size:11px;color:#444}.dest .ln{border-bottom:1px solid #999;height:15px;margin-top:12px}
    table{border-collapse:collapse;width:100%;margin-top:12px}th,td{border:1px solid #888;padding:6px 8px;text-align:center}th{background:#eee}td:first-child,th:first-child{text-align:left}
    .sig{margin-top:46px;display:flex;gap:40px}.sig div{flex:1;border-top:1px solid #333;padding-top:4px;font-size:12px;text-align:center}</style></head>
  <body>${header}<h1>Romaneio de Produção — Lote #${l.numero}${destNome?" · "+destNome:""}</h1>
  <div>Produto: <b>${l.produto}</b> ${l.ref?"("+l.ref+")":""} &nbsp;·&nbsp; Data: ${new Date().toLocaleDateString("pt-BR")} &nbsp;·&nbsp; Total: <b>${totalPecas} peças</b> &nbsp;·&nbsp; Valor: <b>${money(valorTotal)}</b>${valorPP?` (${money(valorPP)}/pç)`:""}</div>
  <table><thead><tr><th>Cor</th>${TAMS.map(t=>`<th>${t}</th>`).join("")}<th>Total</th></tr></thead><tbody>${rows}</tbody><tfoot>${foot}</tfoot></table>
  <div class="sig"><div>Facção / Responsável</div><div>Data de entrega</div><div>Assinatura</div></div>
  <scr`+`ipt>window.onload=function(){window.print()}<\/scr`+`ipt></body></html>`);w.document.close();}

function _bcDe(sku,gtins,cor,tam){const g=gtins&&gtins[cor]&&gtins[cor][tam];if(g&&/^\d{13}$/.test(g))return{bc:g,fmt:'EAN13'};return{bc:sku,fmt:'CODE128'};}
async function gerarEtiquetasDeGrid(ref,nome,grid,tams,codigos,cols,precos,precoOverride,giro,gtins){
  ref=(ref||'').trim(); tams=tams&&tams.length?tams:TAMS; cols=(Number(cols)===1)?1:2;
  const rot=[0,90,180,270].includes(Number(giro))?Number(giro):0; const swap=(rot===90||rot===270);
  const temReais=codigos&&Object.keys(codigos).length;
  const ov=Number(precoOverride)||0;
  if(!ref&&!temReais){uiAlert('Informe a referência (SKU base), ex: C-BP-001, ou puxe o produto do Bling.');return;}
  let itens=[],faltando=[];
  Object.keys(grid||{}).forEach(cor=>{tams.forEach(tam=>{const q=Number((grid[cor]||{})[tam])||0;if(q<=0)return;
    let sku=temReais&&codigos[cor]&&codigos[cor][tam];
    if(!sku){ if(temReais){faltando.push(corLabel(cor)+' '+tam);return;} sku=[ref,cor,tam].filter(Boolean).join('-'); }
    const pr=ov>0?ov:((precos&&precos[cor]&&precos[cor][tam])||0);
    const b=_bcDe(sku,gtins,cor,tam);
    for(let k=0;k<q;k++)itens.push({cor,tam,sku,preco:pr,bc:b.bc,fmt:b.fmt});
  });});
  if(temReais&&faltando.length){ if(!await uiConfirm('Estas variações NÃO têm código cadastrado no Bling e vão ficar de fora (pra não gerar código errado):\n\n'+faltando.join(', ')+'\n\nGerar o restante mesmo assim?'))return; }
  if(!itens.length){uiAlert('Nada pra gerar. Digite quantidade nas variações que têm código no Bling.');return;}
  if(itens.length>2000&&!await uiConfirm('Vão sair '+itens.length+' etiquetas. Continuar?'))return;
  const nomeUP=(nome||'').toString().toUpperCase();
  const logoTag=(typeof PUG_LOGO!=='undefined'&&PUG_LOGO)?('<img class="logo" src="'+PUG_LOGO+'">'):'<div class="logotxt">PUG WEAR</div>';
  const cell=it=>'<div class="etin">'+logoTag+'<div class="nm">'+nomeUP+'</div><div class="fld">COD.: '+ref+'</div><div class="fld">COR: '+corLabel(it.cor)+'</div><div class="fld">TAM.: '+it.tam+'</div>'+(it.preco>0?'<div class="preco">'+money(it.preco)+'</div>':'')+'<div class="bcwrap"><svg class="bc" data-bc="'+it.bc+'" data-fmt="'+it.fmt+'"></svg></div></div>';
  let pagesHtml='';
  for(let i=0;i<itens.length;i+=cols){let slots='';for(let col=0;col<cols;col++){const it=itens[i+col];if(!it)continue;slots+='<div class="et" style="left:'+(col*50)+'mm">'+cell(it)+'</div>';}pagesHtml+='<div class="pg">'+slots+'</div>';}
  const pw=(cols*50);
  const w=window.open('','_blank');
  w.document.write('<html><head><title>Etiquetas</title><meta charset="utf-8">'+
  '<scr'+'ipt src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.5/JsBarcode.all.min.js"></scr'+'ipt>'+
  '<style>@page{size:'+pw+'mm 75mm;margin:0 !important}*{box-sizing:border-box}'+
  'html,body{width:'+pw+'mm !important;margin:0 !important;padding:0 !important;font-family:Arial,Helvetica,sans-serif;color:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact}'+
  '.pg{position:relative;width:'+pw+'mm;height:75mm;overflow:hidden;page-break-after:always}.pg:last-child{page-break-after:auto}'+
  '.et{position:absolute;top:0;width:50mm;height:75mm;overflow:hidden}'+
  '.etin{position:absolute;'+(rot===0?'top:0;left:0;':'top:50%;left:50%;transform:translate(-50%,-50%) rotate('+rot+'deg);')+'width:'+(swap?'75mm':'50mm')+';height:'+(swap?'50mm':'75mm')+';padding:13mm 5mm 2mm;display:flex;flex-direction:column}'+
  '.logo{display:block;margin:0 auto 1.5mm;height:12mm;object-fit:contain}'+
  '.logotxt{text-align:center;font-weight:900;font-size:15pt;letter-spacing:1px;margin-bottom:1.5mm}'+
  '.nm{font-weight:bold;font-size:8.5pt;line-height:1.1;margin-bottom:0.8mm}'+
  '.fld{font-size:8.5pt;line-height:1.35}'+
  '.preco{font-weight:bold;font-size:12pt;margin-top:0.8mm}'+
  '.bcwrap{margin-top:auto;text-align:center;width:100%}.bc{width:40mm;height:22mm}'+
  '</style></head><body>'+pagesHtml+
  '<scr'+'ipt>window.onload=function(){document.querySelectorAll(".bc").forEach(function(s){try{var f=s.getAttribute("data-fmt")||"CODE128";JsBarcode(s,s.getAttribute("data-bc"),{format:f,displayValue:true,fontSize:15,height:95,width:(f==="EAN13"?2.2:2),margin:2});}catch(e){}});setTimeout(function(){window.print();},500);};</scr'+'ipt>'+
  '</body></html>');
  w.document.close();
}
function _etLoad(l){const partes=[];(l.etapas||[]).forEach(e=>{if(e.partes&&e.partes.length){e.partes.forEach(p=>{if(p.faccaoId)partes.push({label:fName(p.faccaoId)+' · '+e.nome,grade:parteGrade(l,p)});});}});window._ET={ref:l.ref||'',nome:l.produto||'',tams:tamsDe(l),cores:Object.keys(coresDe(l)),grid:JSON.parse(JSON.stringify(coresDe(l))),codigos:null,loteId:l.id,partes:partes,parteSel:''};}
function etqSelParte(v){const E=window._ET;if(!E)return;E.parteSel=v;const l=S.lotes.find(x=>x.id===E.loteId);if(v===''||!E.partes||!E.partes[v]){const g=l?coresDe(l):{};E.grid=JSON.parse(JSON.stringify(g));E.cores=Object.keys(g);}else{const g=E.partes[v].grade||{};E.grid=JSON.parse(JSON.stringify(g));E.cores=Object.keys(g);}vEtiq();}
async function etqPullCodigos(ref){ // busca os códigos REAIS no Bling pra não gerar SKU errado
  ref=(ref||'').trim(); if(!ref)return;
  try{const {status,data}=await blingApi('produto',{ref});
    if(status===200&&data.codigos){window._ET.codigos=data.codigos;window._ET.gtins=data.gtins||null;window._ET.precos=data.precos||null;window._ET.precoPadrao=data.precoPadrao||0;if(data.produto&&!window._ET.nome)window._ET.nome=data.produto;vEtiq();
      const el=document.getElementById('etqAviso');if(el)el.textContent='✓ códigos reais puxados do Bling';}
  }catch(e){}
}
function etqAbrirDoLote(id){const l=S.lotes.find(x=>x.id===id);if(!l)return;_etLoad(l);document.querySelector('.tabbar button[data-t=etiq]').click();setTimeout(()=>etqPullCodigos(l.ref),100);}
function etqDoLote(lid){if(!lid){return;}const l=S.lotes.find(x=>x.id===lid);_etLoad(l);vEtiq();etqPullCodigos(l.ref);}
const PRECOS_FAM={'C-BP-001':89.90,'P-PB-001':99.90,'M-BP-001':79.90,'M-CM-004':119.90,'C-BP-002':99.90,'S-BF-001':159.90,'S-CLF-001':239.90,'B-PREMIUM':139.90,'C-TEX-PUG':99.90,'C-JM':219.90,'CM-PUG':139.90,'J-CUMFY':189.90,'M-BP-JOG-001':69.90,'C-ALF-MILAO':249.90};
async function etqDoBling(){
  const ref=(document.getElementById('etqRef').value||'').trim();
  if(!ref){uiAlert('Digite a referência do produto (ex: C-BP-001).');return;}
  toast('Puxando '+ref+' do Bling…');
  try{
    const {status,data}=await blingApi('produto',{ref});
    if(status!==200||!data||!data.cores||!data.cores.length){uiAlert('Não achei variações de "'+ref+'" no Bling. Confira a referência.');return;}
    const pp=data.precoPadrao||PRECOS_FAM[ref.toUpperCase()]||0;
    window._ET={ref,nome:data.produto||ref,tams:(data.tamanhos&&data.tamanhos.length?data.tamanhos:TAMS),cores:data.cores,grid:{},codigos:data.codigos||{},gtins:data.gtins||{},precos:data.precos||{},precoPadrao:pp};
    vEtiq();toast(data.cores.length+' cores puxadas ✓ (Bling)');
  }catch(e){uiAlert('Erro ao puxar do Bling. Tente de novo.');}
}
function etqSet(cor,tam,val){const E=window._ET;if(!E)return;E.grid[cor]=E.grid[cor]||{};E.grid[cor][tam]=Number(val)||0;const el=document.getElementById('etqTot');if(el)el.textContent=etqTotal();}

function _etItens(ref,grid,tams,codigos,precos,ov,gtins){
  const temReais=codigos&&Object.keys(codigos).length;let itens=[],faltando=[];
  Object.keys(grid||{}).forEach(function(cor){tams.forEach(function(tam){const q=Number((grid[cor]||{})[tam])||0;if(q<=0)return;
    let sku=temReais&&codigos[cor]&&codigos[cor][tam];
    if(!sku){if(temReais){faltando.push(corLabel(cor)+' '+tam);return;}sku=[ref,cor,tam].filter(Boolean).join('-');}
    const pr=ov>0?ov:((precos&&precos[cor]&&precos[cor][tam])||0);
    const b=_bcDe(sku,gtins,cor,tam);
    for(let k=0;k<q;k++)itens.push({cor:cor,tam:tam,sku:sku,preco:pr,bc:b.bc,fmt:b.fmt});});});
  return {itens:itens,faltando:faltando,temReais:temReais};
}
async function gerarEtiquetasPDF(ref,nome,grid,tams,codigos,cols,precos,ov,gtins){
  ref=(ref||'').trim();tams=tams&&tams.length?tams:TAMS;cols=(Number(cols)===1)?1:2;
  const r=_etItens(ref,grid,tams,codigos,precos,ov,gtins);
  if(r.temReais&&r.faltando.length){if(!await uiConfirm('Variações SEM código no Bling (ficam de fora):\n\n'+r.faltando.join(', ')+'\n\nGerar o resto?'))return;}
  const itens=r.itens; if(!itens.length){await uiAlert('Digite ao menos 1 quantidade.');return;}
  toast('Gerando PDF…');
  try{
    await _loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    await _loadScript('https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.5/JsBarcode.all.min.js');
  }catch(e){await uiAlert('Não consegui carregar o gerador de PDF (precisa de internet).');return;}
  const jsPDF=(window.jspdf&&window.jspdf.jsPDF)||window.jsPDF;
  const pageW=cols*50,pageH=75;
  const _ori=(pageW>pageH?'landscape':'portrait');
  const doc=new jsPDF({unit:'mm',format:[pageW,pageH],orientation:_ori});
  function bc(val,fmt){const c=document.createElement('canvas');try{JsBarcode(c,val,{format:fmt||'CODE128',displayValue:true,fontSize:26,height:240,width:4,margin:0});}catch(e){}return c.toDataURL('image/png');}
  const nomeUP=(nome||'').toString().toUpperCase();
  let first=true;
  for(let idx=0;idx<itens.length;idx+=cols){
    if(!first)doc.addPage([pageW,pageH],_ori);first=false;
    for(let col=0;col<cols;col++){
      const it=itens[idx+col];if(!it)continue;const x=col*50,pad=5;
      try{doc.addImage(PUG_LOGO,'PNG',x+(50-11)/2,12,11,12);}catch(e){}
      let y=27;doc.setFont('helvetica','bold');doc.setFontSize(8);
      const nm=doc.splitTextToSize(nomeUP,42);doc.text(nm,x+pad,y);y+=nm.length*3.6+1.5;
      doc.setFont('helvetica','normal');doc.setFontSize(7.5);
      doc.text('COD.: '+ref,x+pad,y);y+=3.8;doc.text('COR: '+corLabel(it.cor),x+pad,y);y+=3.8;doc.text('TAM.: '+it.tam,x+pad,y);y+=4.8;
      if(it.preco>0){doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text(money(it.preco),x+pad,y);}
      try{doc.addImage(bc(it.bc,it.fmt),'PNG',x+5,pageH-26,40,22);}catch(e){}
    }
  }
  try{doc.autoPrint();}catch(e){}
  try{window.open(doc.output('bloburl'),'_blank');}catch(e){doc.save('etiquetas.pdf');}
}

function mergeFaccoesDuplicadas(){
  const byName={};
  S.faccoes.forEach(f=>{const k=(f.nome||'').trim().toLowerCase();if(!k)return;(byName[k]=byName[k]||[]).push(f);});
  const remap={};
  Object.values(byName).forEach(list=>{if(list.length<2)return;const canon=list.find(f=>f.blingId)||list.find(f=>f.cnpj)||list[0];list.forEach(f=>{if(f.id!==canon.id)remap[f.id]=canon.id;});});
  const olds=Object.keys(remap);if(!olds.length)return false;
  S.lotes.forEach(l=>l.etapas.forEach(e=>{if(remap[e.faccaoId])e.faccaoId=remap[e.faccaoId];if(e.partes)e.partes.forEach(p=>{if(remap[p.faccaoId])p.faccaoId=remap[p.faccaoId];});}));
  S.faccoes=S.faccoes.filter(f=>!olds.includes(f.id));
  return true;
}
function autoLimpaExemplos(){
  const temReal=(S.lotes||[]).some(l=>!(l.historico||[]).some(h=>/exemplo/i.test(h.t||"")));
  if(!temReal)return false;
  const aF=S.faccoes.length,aL=S.lotes.length;
  S.faccoes=S.faccoes.filter(f=>!/\(exemplo\)/i.test(f.nome||""));
  S.lotes=S.lotes.filter(l=>!(l.historico||[]).some(h=>/exemplo/i.test(h.t||"")));
  return S.faccoes.length!==aF||S.lotes.length!==aL;
}
async function limparExemplos(){
  const faccEx=S.faccoes.filter(f=>/\(exemplo\)/i.test(f.nome||""));
  const loteEx=S.lotes.filter(l=>(l.historico||[]).some(h=>/exemplo/i.test(h.t||"")));
  if(!faccEx.length&&!loteEx.length){uiAlert("Não há dados de exemplo pra limpar.");return;}
  if(!await uiConfirm(`Apagar os dados de exemplo?\n\nFacções: ${faccEx.length}\nLotes: ${loteEx.length}\n\nSeus dados reais não são afetados.`))return;
  const idsEx=faccEx.map(f=>f.id);
  S.faccoes=S.faccoes.filter(f=>!idsEx.includes(f.id));
  S.lotes=S.lotes.filter(l=>!(l.historico||[]).some(h=>/exemplo/i.test(h.t||"")));
  save();render();toast("Dados de exemplo removidos ✓");
}

function _setBlingId(ctx,v){if(ctx==='q')_quickBlingId=v;else _faccaoBlingId=v;}
function _resultHtml(lista,ctx){return lista.map(c=>`<div class="row" style="justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)"><span>${c.nome}${c.doc?` <span class="muted">(${c.doc})</span>`:""}</span><button class="btn sec mini" type="button" onclick="usarFaccaoBling('${ctx}',${c.id},'${(c.nome||'').replace(/'/g,'')}')">usar</button></div>`).join("");}
async function listarFaccoesBling(ctx){
  const f=_fFields(ctx);const box=document.getElementById(f.result);box.textContent="Carregando facções do Bling…";
  try{
    const {status,data}=await blingApi("fornecedores",{});
    const lista=(data.fornecedores||[]);
    if(status!==200||!lista.length){box.textContent="Não consegui listar (status "+status+").";return;}
    box.innerHTML=`<div class="muted" style="margin-bottom:4px">${lista.length} fornecedores — clique em "usar":</div>`+_resultHtml(lista,ctx);
  }catch(e){box.textContent="Erro ao listar. Tente de novo.";}
}
async function buscarFaccaoBling(ctx){
  const f=_fFields(ctx);const q=(document.getElementById(f.busca).value||"").trim();const box=document.getElementById(f.result);
  if(!q){box.textContent="Digite um nome (ou use Listar facções).";return;}
  box.textContent="Buscando…";
  try{
    const {status,data}=await blingApi("faccoes",{q});
    const lista=(data.faccoes||[]);
    if(status!==200||!lista.length){box.textContent="Nada encontrado pra \""+q+"\". Tente o começo do nome, ou Listar facções.";return;}
    box.innerHTML=_resultHtml(lista.slice(0,12),ctx);
  }catch(e){box.textContent="Erro na busca. Tente de novo.";}
}
async function usarFaccaoBling(ctx,id,nome){
  const f=_fFields(ctx);_setBlingId(ctx,String(id));
  document.getElementById(f.nome).value=nome;
  const box=document.getElementById(f.result);box.textContent="Puxando CNPJ/endereço…";
  try{
    const {data}=await blingApi("faccao",{id});
    if(data.cnpj)document.getElementById(f.cnpj).value=data.cnpj;
    if(data.endereco)document.getElementById(f.end).value=data.endereco;
    box.innerHTML=`✓ "${nome}" vinculado ao Bling${data.fornecedor?" (fornecedor)":""}. Ajuste o valor/serviço e salve.`;
  }catch(e){box.textContent="Vinculado, mas não consegui puxar CNPJ/endereço.";}
}
async function delFaccao(id){if(await uiConfirm("Excluir facção?")){S.faccoes=S.faccoes.filter(x=>x.id!==id);save();render();}}

// ---------- FINANCEIRO ----------
function _finKey(fid){const f=S.faccoes.find(x=>x.id===fid)||{};return 'n:'+(((f.nome||fid)+'').trim().toLowerCase());}
function finPorFaccao(cutoff){const map={};
  const okData=dt=>{if(!cutoff)return true;if(!dt)return false;return (dt+"").slice(0,10)<=cutoff;};
  function add(fid,it){const k=_finKey(fid);if(!map[k]){const f=S.faccoes.find(x=>x.id===fid)||{};map[k]={key:k,nome:f.nome||fName(fid),blingId:f.blingId||"",faccaoIds:[],total:0,aReceber:0,entregue:0,producao:0,fechavel:0,fechamento:0,itens:[]};}
    const m=map[k];if(!m.faccaoIds.includes(fid))m.faccaoIds.push(fid);if(!m.blingId){const f=S.faccoes.find(x=>x.id===fid);if(f&&f.blingId)m.blingId=f.blingId;}
    it.faccaoId=fid;it.noFechamento=(!it.pago&&it.concluido&&okData(it.dtRet));m.total+=it.base;
    if(!it.pago){m.aReceber+=it.base;if(it.concluido){m.entregue+=it.base;m.fechavel+=it.base;if(okData(it.dtRet))m.fechamento+=it.base;}else m.producao+=it.base;}
    m.itens.push(it);}
  S.lotes.forEach(l=>{const enc=!!l.encerrado;l.etapas.forEach(e=>{
    if(e.partes&&e.partes.length){e.partes.forEach(p=>{if(!p.faccaoId)return;const q=qParte(l,p);const base=q*(Number(p.valor)||0);if(base<=0)return;
      add(p.faccaoId,{lote:l.numero,etapa:e.nome+" (dividida)",q,v:p.valor,base,pago:!!p.pago,concluido:(p.status==="Concluído"||e.status==="Concluído"),dtRet:(p.dtRet||e.dtRet||""),encerrado:enc,ref:{lid:l.id,nome:e.nome}});});return;}
    if(!e.faccaoId)return;const q=qEtapa(e);const base=q*(Number(e.valor)||0);if(base<=0)return;
    add(e.faccaoId,{lote:l.numero,etapa:e.nome,q,v:e.valor,base,pago:!!e.pago,concluido:(e.status==="Concluído"),dtRet:(e.dtRet||""),encerrado:enc,ref:{lid:l.id,nome:e.nome}});
  });});const arr=Object.values(map);arr.forEach(m=>m.pendente=m.aReceber);return arr;}
function perdaGrupo(faccaoIds){let env=0,ret=0;S.lotes.forEach(l=>l.etapas.forEach(e=>{
  if(e.partes&&e.partes.length){e.partes.forEach(p=>{if(faccaoIds.includes(p.faccaoId)&&Number(p.qtdRet)!==0){const en=totPartes(parteGrade(l,p));env+=en;ret+=qParte(l,p);}});}
  else if(faccaoIds.includes(e.faccaoId)&&Number(e.qtdRet)!==0){env+=Number(e.qtdEnv)||0;ret+=qEtapa(e);}
}));const perda=env-ret;return{env,ret,perda,pct:env?perda/env*100:0};}
function setFinData(v){S.finAteData=v||fimMesAtual();save();vFin();}
function setFinFiltro(v){S.finFiltro=v||"";save();vFin();}
function vFin(){const cutoff=S.finAteData||fimMesAtual();const dados=finPorFaccao(cutoff).sort((a,b)=>(b.fechamento||0)-(a.fechamento||0)||b.aReceber-a.aReceber);
  const lotesAbertosMes=S.lotes.filter(l=>!["Concluído","Encerrado"].includes(statusLote(l)));
  const filtro=(S.finFiltro||"").toLowerCase().trim();
  const dadosF=filtro?dados.filter(f=>(f.nome||"").toLowerCase().includes(filtro)):dados;
  const totalFechamento=dados.reduce((s,f)=>s+(f.fechamento||0),0);
  const totalEntregue=dados.reduce((s,f)=>s+f.entregue,0);
  const totalProd=dados.reduce((s,f)=>s+f.producao,0);
  const totalReceber=dados.reduce((s,f)=>s+f.aReceber,0);
  document.getElementById("app").innerHTML=`
  <div class="card"><h2 style="margin:0 0 6px">Fechamento de pagamento</h2>
    <div class="row" style="align-items:center;gap:8px;flex-wrap:wrap"><label style="margin:0">Entregue até:</label><input type="date" value="${cutoff}" onchange="setFinData(this.value)" style="max-width:175px"><input list="finFacList" placeholder="🔎 Filtrar facção" value="${S.finFiltro||''}" oninput="setFinFiltro(this.value)" style="max-width:180px"><datalist id="finFacList">${dados.map(f=>`<option value="${f.nome}">`).join("")}</datalist>${filtro?`<button class="btn mini sec" onclick="setFinFiltro('')">limpar</button>`:''}</div>
    <div class="between" style="margin-top:10px"><span><b>A pagar</b> (entregue até ${dataBR(cutoff)}):</span><b class="tot" style="color:var(--acc)">${money(totalFechamento)}</b></div>
    <div class="muted" style="margin-top:6px">Conta só etapas/partes <b>concluídas, não pagas e entregues até ${dataBR(cutoff)}</b>. Entregue no total (qualquer data): ${money(totalEntregue)} · Em produção: ${money(totalProd)} · A receber total: ${money(totalReceber)}</div></div>
  <div class="card"><div class="between"><h2 style="margin:0">Lotes em aberto no mês</h2><b class="tot" style="color:var(--warn)">${lotesAbertosMes.length}</b></div>
    ${lotesAbertosMes.length?lotesAbertosMes.map(l=>`<div class="between" style="padding:4px 0;border-bottom:1px solid var(--card2);cursor:pointer" onclick="abrirLote('${l.id}')"><span>#${l.numero} · ${l.produto}</span>${pill(statusLote(l))}</div>`).join(""):'<div class="muted">Nenhum lote em aberto — tudo concluído/encerrado ✓</div>'}</div>
  ${dadosF.filter(f=>f.aReceber>0).map(f=>`<div class="card"><div class="between"><b>${f.nome}</b><span>Fechamento: <b style="color:var(--acc)">${money(f.fechamento||0)}</b></span></div>
    <div class="muted" style="margin:4px 0">Entregue até ${dataBR(cutoff)}: <b style="color:var(--acc)">${money(f.fechamento||0)}</b> · Entregue total: ${money(f.entregue)} · Em produção: ${money(f.producao)}</div>
    <table><tr><th>Lote</th><th>Etapa</th><th>Entrega</th><th class="right">Qtd</th><th class="right">Total</th><th>Situação</th><th></th></tr>
    ${f.itens.map(it=>`<tr><td>#${it.lote}</td><td>${it.etapa}</td><td>${dataBR(it.dtRet)}</td><td class="right">${it.q}</td><td class="right">${money(it.base)}</td><td>${it.pago?'<span class="pill p-ok">pago</span>':(it.concluido?(it.noFechamento?'<span class="pill" style="background:var(--acc);color:#022">no fechamento</span>':'<span class="pill" style="background:#999;color:#fff">após o corte</span>'):'produção')}</td><td class="right">${it.pago?`<button class="btn mini sec" onclick="estornarFaccaoEtapa('${it.ref.lid}','${(it.ref.nome||'').replace(/'/g,'')}','${it.faccaoId}')">↩️ estornar</button>`:(it.concluido?`<button class="btn mini" onclick="baixarFaccaoEtapa('${it.ref.lid}','${(it.ref.nome||'').replace(/'/g,'')}','${it.faccaoId}')">baixar</button>`:`<span class="muted" style="font-size:11px">em produção</span>`)}</td></tr>`).join("")}</table>
    ${(()=>{const p=perdaGrupo(f.faccaoIds);return p.env?`<div class="muted" style="margin-top:6px">Qualidade: enviado ${p.env} · retornado ${p.ret} · <b style="color:${p.pct>2?'var(--warn)':'var(--acc)'}">perda ${p.pct.toFixed(1)}% (${p.perda} pç)</b></div>`:'';})()}
    <div class="between" style="margin-top:8px"><span class="muted">Total geral: ${money(f.total)}</span><button class="btn mini sec" onclick="gerarContaPagar('${f.key}')"${(f.fechamento||0)<=0?' disabled title="Nada entregue até a data"':''}>🧾 Gerar conta (até ${dataBR(cutoff)})</button></div></div>`).join("")||'<div class="muted">Sem valores. Defina facção + valor nas etapas.</div>'}`;}
async function gerarContaPagar(key){
  const cutoff=S.finAteData||fimMesAnterior();
  const okData=dt=>!dt?false:((dt+"").slice(0,10)<=cutoff);
  const fin=finPorFaccao(cutoff).find(x=>x.key===key); if(!fin){return;}
  if((fin.fechamento||0)<=0){uiAlert("Não há etapa CONCLUÍDA e ENTREGUE até "+dataBR(cutoff)+" pendente para esta facção.\n\nAjuste a data do fechamento ou marque a etapa/parte como concluída.");return;}
  if(!fin.blingId){uiAlert("Esta facção não está vinculada ao Bling. Edite a facção e use \"Buscar no Bling\" pra vincular antes de gerar a conta.");return;}
  const ids=fin.faccaoIds;
  const venc=await uiPrompt("Vencimento da conta (AAAA-MM-DD):",hoje()); if(!venc)return;
  if(!await uiConfirm(`Gerar conta a pagar no Bling (entregue até ${dataBR(cutoff)})?\n\nFacção: ${fin.nome}\nValor: ${money(fin.fechamento)}\nVencimento: ${venc}`))return;
  toast("Gerando no Bling…");
  try{
    const {status,data}=await blingApi("conta-pagar",{},{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({idContato:fin.blingId,valor:fin.fechamento,vencimento:venc,historico:"Produção entregue até "+dataBR(cutoff)+" — "+fin.nome})});
    if(status>=200&&status<300&&data&&data.data&&data.data.id){
      // dá baixa só nas etapas/partes CONCLUÍDAS, não pagas e ENTREGUES até a data de corte
      S.lotes.forEach(l=>{let mexeu=false;l.etapas.forEach(e=>{
        if(e.partes&&e.partes.length){e.partes.forEach(p=>{if(ids.includes(p.faccaoId)&&!p.pago&&(p.status==="Concluído"||e.status==="Concluído")&&okData(p.dtRet||e.dtRet)){p.pago=true;mexeu=true;}});}
        else if(ids.includes(e.faccaoId)&&!e.pago&&e.status==="Concluído"&&okData(e.dtRet)){e.pago=true;mexeu=true;}});
        if(mexeu)l.historico.push({q:new Date().toLocaleString("pt-BR"),t:`Conta a pagar gerada (Bling nº ${data.data.id}, até ${dataBR(cutoff)}) — ${fin.nome}`});});
      save();render();
      uiAlert("Conta a pagar criada no Bling ✓ (nº "+(data.data.id)+")\nAs etapas concluídas dessa facção foram baixadas.");
    } else {
      uiAlert("Não consegui criar a conta no Bling.\n"+(JSON.stringify(data).slice(0,200)));
    }
  }catch(e){uiAlert("Erro ao falar com o Bling. Tente de novo.");}
}
function marcarPago(lid,nome){const l=S.lotes.find(x=>x.id===lid);const e=l.etapas.find(x=>x.nome===nome);e.pago=true;if(e.partes)e.partes.forEach(p=>p.pago=true);l.historico.push({q:new Date().toLocaleString("pt-BR"),t:`Pagamento baixado — ${nome} (${fName(e.faccaoId)})`});save();render();toast("Baixado ✓");}
function baixarFaccaoEtapa(lid,nome,faccaoId){const l=S.lotes.find(x=>x.id===lid);const e=l.etapas.find(x=>x.nome===nome);if(!e)return;if(e.partes&&e.partes.length){e.partes.forEach(p=>{if(p.faccaoId===faccaoId)p.pago=true;});}else if(e.faccaoId===faccaoId){e.pago=true;}l.historico.push({q:new Date().toLocaleString("pt-BR"),t:`Pagamento baixado — ${nome} / ${fName(faccaoId)}`});save();render();toast("Baixado ✓");}

function openSheet(h){document.getElementById("sheet").innerHTML=h;document.getElementById("modal").classList.add("on");}
function closeSheet(){document.getElementById("modal").classList.remove("on");}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeSheet();});
startApp();

function _uiEsc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');}
function _uiEscAttr(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/"/g,'&quot;');}
function _uiBox(inner){var o=document.createElement('div');o.className='uiov';o.innerHTML='<div class="uibox">'+inner+'</div>';document.body.appendChild(o);return o;}
function uiAlert(msg,titulo){return new Promise(function(res){var o=_uiBox('<div class="uititle">'+_uiEsc(titulo||'Aviso')+'</div><div class="uimsg">'+_uiEsc(msg)+'</div><div class="uibtns"><button class="btn" id="_uiok">OK</button></div>');o.querySelector('#_uiok').onclick=function(){o.remove();res();};});}
function uiConfirm(msg,opts){opts=opts||{};return new Promise(function(res){var o=_uiBox('<div class="uititle">'+_uiEsc(opts.titulo||'Confirmar')+'</div><div class="uimsg">'+_uiEsc(msg)+'</div><div class="uibtns"><button class="btn sec" id="_uic">'+_uiEsc(opts.cancel||'Cancelar')+'</button><button class="btn" id="_uiok">'+_uiEsc(opts.ok||'OK')+'</button></div>');o.querySelector('#_uiok').onclick=function(){o.remove();res(true);};o.querySelector('#_uic').onclick=function(){o.remove();res(false);};});}
function uiPrompt(msg,def){return new Promise(function(res){var o=_uiBox('<div class="uititle">Digite</div><div class="uimsg">'+_uiEsc(msg)+'</div><input id="_uii" class="uiinp" value="'+_uiEscAttr(def||'')+'"><div class="uibtns"><button class="btn sec" id="_uic">Cancelar</button><button class="btn" id="_uiok">OK</button></div>');var inp=o.querySelector('#_uii');setTimeout(function(){try{inp.focus();inp.select();}catch(e){}},30);o.querySelector('#_uiok').onclick=function(){var v=inp.value;o.remove();res(v);};o.querySelector('#_uic').onclick=function(){o.remove();res(null);};inp.addEventListener('keydown',function(e){if(e.key==='Enter'){var v=inp.value;o.remove();res(v);}else if(e.key==='Escape'){o.remove();res(null);}});});}
</script>
</body>
